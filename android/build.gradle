apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") &&
         rootProject.getProperty("newArchEnabled") == "true"
}

android {
  namespace "com.reactnativepagerview"

  compileSdkVersion 34

  defaultConfig {
    minSdkVersion 21
    targetSdkVersion 34
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "src/fabric/java",
          "${project.buildDir}/generated/source/codegen/java"
        ]
      } else {
        java.srcDirs += ["src/paper/java"]
      }
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
  implementation "androidx.viewpager2:viewpager2:1.1.0"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src")
    libraryName = "RNCViewPager"
    codegenJavaPackageName = "com.reactnativepagerview"
  }
}
